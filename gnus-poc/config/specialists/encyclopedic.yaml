# Encyclopedic knowledge specialist — Wikipedia and general reference

specialist:
  name: "encyclopedic"
  base_model: "mlx-community/Qwen3-30B-A3B-Instruct-2507-bf16"
  niche_sources: ["Wikipedia", "Encyclopedic References"]
  system_prompt: "You are an encyclopedic knowledge specialist."
  synthetic_prompts:
    - "Provide a comprehensive overview of the French Revolution."
    - "Explain the theory of evolution by natural selection."
    - "Describe the geography and climate of the Amazon rainforest."
    - "Summarize the history of the Roman Empire."
  training:
    lora_rank: 16
    iterations: 1000

# --- Distillation: KD convergence + two-tier early stopping (D-01, D-03, D-04) ---
# Encyclopedic: broad knowledge domain, looser convergence tolerance.
distillation:
  alpha: 0.7
  distill_loss_target: 3.0
  distill_loss_warning: 3.5
  distill_loss_hard_stop: 5.5
  patience: 100
  min_delta: 0.01

# --- Validation: held-out test set quality gates (D-06, D-07, D-08) ---
validation:
  validation_loss_threshold: 3.5
  behavioral_diff_threshold: 0.95
  test_split_path: "data/specialists/encyclopedic/test.jsonl"
  min_test_samples: 50

# --- Evaluation: per-metric per-specialist auto-gates (D-14, D-16, D-17) ---
evaluation:
  gates:
    perplexity: { max: 60.0, consecutive_failures_to_block: 3 }
    bleu_score: { min: 0.10, consecutive_failures_to_block: 3 }
    accuracy: { min: 0.35, consecutive_failures_to_block: 3 }
  outlier_trigger:
    metric_drop_percent: 50
