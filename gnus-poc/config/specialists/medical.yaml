# Medical specialist — overrides for pipeline.yaml defaults

specialist:
  name: "medical"
  base_model: "mlx-community/Qwen3-30B-A3B-Instruct-2507-bf16"
  niche_sources: ["PubMed Abstracts", "PubMed Central", "NIH ExPorter"]
  system_prompt: "You are a medical research specialist."
  synthetic_prompts:
    - "Explain the mechanism of action for a novel drug target in oncology."
    - "Summarize recent advances in CRISPR-based gene therapy."
    - "Describe the pathophysiology of a common autoimmune disorder."
    - "Review the clinical trial results for a recently approved immunotherapy."
    - "Explain the diagnostic criteria for a rare genetic disease."
  training:
    lora_rank: 16
    iterations: 1000

# --- Distillation: KD convergence + two-tier early stopping (D-01, D-03, D-04) ---
# Medical: accuracy-critical, tighter convergence (similar to code).
distillation:
  alpha: 0.7
  distill_loss_target: 2.5
  distill_loss_warning: 3.0
  distill_loss_hard_stop: 5.0
  patience: 100
  min_delta: 0.01

# --- Validation: held-out test set quality gates (D-06, D-07, D-08) ---
validation:
  validation_loss_threshold: 3.0
  behavioral_diff_threshold: 0.95
  test_split_path: "data/specialists/medical/test.jsonl"
  min_test_samples: 50

# --- Evaluation: per-metric per-specialist auto-gates (D-14, D-16, D-17) ---
# Medical: strictest thresholds (highest accuracy expectation).
evaluation:
  gates:
    perplexity: { max: 45.0, consecutive_failures_to_block: 3 }
    bleu_score: { min: 0.20, consecutive_failures_to_block: 3 }
    accuracy: { min: 0.50, consecutive_failures_to_block: 3 }
  outlier_trigger:
    metric_drop_percent: 50
