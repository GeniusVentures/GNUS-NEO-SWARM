# Code specialist — uses Qwen3-Coder base model (different from default)

specialist:
  name: "code"
  base_model: "mlx-community/Qwen3-Coder-30B-A3B-Instruct-bf16"
  niche_sources: ["GitHub", "StackOverflow", "Programming Language Documentation"]
  system_prompt: "You are a programming and code documentation specialist."
  synthetic_prompts:
    - "Explain how to implement a thread-safe singleton pattern in Python."
    - "Document the time complexity of common sorting algorithms."
    - "Write a code review for a pull request implementing a REST API endpoint."
    - "Explain the difference between async/await and threading for concurrent I/O."
  training:
    lora_rank: 16
    iterations: 1000

# --- Distillation: KD convergence + two-tier early stopping (D-01, D-03, D-04) ---
distillation:
  alpha: 0.7
  distill_loss_target: 2.5
  distill_loss_warning: 3.0
  distill_loss_hard_stop: 5.0
  patience: 100
  min_delta: 0.01

# --- Validation: held-out test set quality gates (D-06, D-07, D-08) ---
validation:
  validation_loss_threshold: 3.0
  behavioral_diff_threshold: 0.95
  test_split_path: "data/specialists/code/test.jsonl"
  min_test_samples: 50

# --- Evaluation: per-metric per-specialist auto-gates (D-14, D-16, D-17) ---
evaluation:
  gates:
    perplexity: { max: 50.0, consecutive_failures_to_block: 3 }
    bleu_score: { min: 0.15, consecutive_failures_to_block: 3 }
    accuracy: { min: 0.40, consecutive_failures_to_block: 3 }
  outlier_trigger:
    metric_drop_percent: 50
