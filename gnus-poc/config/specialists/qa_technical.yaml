# Technical Q&A specialist — StackExchange and technical documentation

specialist:
  name: "qa_technical"
  base_model: "mlx-community/Qwen3-30B-A3B-Instruct-2507-bf16"
  niche_sources: ["StackExchange", "Technical Documentation", "Q&A Forums"]
  system_prompt: "You are a technical Q&A specialist."
  synthetic_prompts:
    - "How do I optimize a PostgreSQL query that joins five tables?"
    - "What are the best practices for securing a Kubernetes cluster?"
    - "Explain how DNS resolution works step by step."
    - "Troubleshoot a 502 Bad Gateway error on an Nginx reverse proxy."
  training:
    lora_rank: 16
    iterations: 1000

# --- Distillation: KD convergence + two-tier early stopping (D-01, D-03, D-04) ---
# Q&A Technical: technical accuracy, tighter convergence.
distillation:
  alpha: 0.7
  distill_loss_target: 2.5
  distill_loss_warning: 3.0
  distill_loss_hard_stop: 5.0
  patience: 100
  min_delta: 0.01

# --- Validation: held-out test set quality gates (D-06, D-07, D-08) ---
validation:
  validation_loss_threshold: 3.0
  behavioral_diff_threshold: 0.95
  test_split_path: "data/specialists/qa_technical/test.jsonl"
  min_test_samples: 50

# --- Evaluation: per-metric per-specialist auto-gates (D-14, D-16, D-17) ---
evaluation:
  gates:
    perplexity: { max: 50.0, consecutive_failures_to_block: 3 }
    bleu_score: { min: 0.15, consecutive_failures_to_block: 3 }
    accuracy: { min: 0.45, consecutive_failures_to_block: 3 }
  outlier_trigger:
    metric_drop_percent: 50
