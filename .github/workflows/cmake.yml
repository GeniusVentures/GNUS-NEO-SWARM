name: Lint CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format clang-tidy

      - name: Run clang-format
        run: find src/ -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | xargs clang-format --dry-run

      - name: Run clang-tidy
        run: find src/ -name "*.cpp" | xargs clang-tidy -- -std=c++17 -I src/
        continue-on-error: true
